<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rate Limit Exceeded</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .container {
        background: #ffffff;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow:
          0 10px 25px rgba(0, 0, 0, 0.05),
          0 4px 6px rgba(0, 0, 0, 0.02);
        border: 1px solid #e2e8f0;
        width: 90%;
        max-width: 500px;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        color: #e11d48;
        margin-bottom: 0.5rem;
      }
      p {
        color: #64748b;
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 1.5rem;
      }
      a {
        display: inline-block;
        padding: 0.6rem 1.2rem;
        background-color: #0284c7;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
      }
      a:hover {
        background-color: #0369a1;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Too Many Requests</h1>
      <p>
        You have made too many proxy requests in a short time. Please wait a
        minute before browsing further.
      </p>
      <a href="/">Return to Home</a>
    </div>
  </body>
</html>
